name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select Xcode
        run: |
          # Pick the newest Xcode 16+ available on the runner.
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build (Debug)
        run: swift build -c debug

      # The SessionController coroutine/timer tests drive an async timer loop on
      # a wall clock (wait.time fence/dequeue, autoreconnect, the unreachable-host
      # timeout, …). On the few-core macos-15 runner those starve and flake (#26),
      # badly under `--parallel`. Mitigations: run serially (much lower flake
      # rate + deterministic), and retry the suite up to 3× so a residual flake
      # doesn't redden the build. Developers still use `swift test --parallel`
      # locally (the documented gate). The real fix — making those tests clock-
      # independent — is tracked in #26.
      - name: Test
        run: |
          for attempt in 1 2 3; do
            echo "::group::swift test --no-parallel (attempt $attempt/3)"
            if swift test --no-parallel; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "attempt $attempt failed (likely a timing flake, #26); retrying"
          done
          echo "tests failed after 3 attempts"; exit 1

  app-build:
    # The macOS app target is XcodeGen-generated and NOT covered by
    # `swift build` — app-side breakage (ContentView & friends) used to be
    # caught only on a developer machine (#26). No signing on CI: the build
    # verifies compilation, not distribution.
    name: App Build (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache xcodebuild SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-xcodebuild-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcodebuild-spm-

      - name: Generate project + build app
        run: |
          set -euo pipefail
          cd apps/ProtelesApp_macOS
          xcodegen generate
          xcodebuild \
            -project ProtelesApp_macOS.xcodeproj \
            -scheme ProtelesApp_macOS \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build

  ios-test:
    # The iOS half of the port's safety net (GitHub #81, phase I0a). MudCore is
    # platform-agnostic and its suite is host-agnostic, so the same ~1,840 tests
    # that gate macOS also gate iOS — which is the whole reason the port is
    # tractable. Running this from the very first iOS commit means MudCore
    # changes are checked against iOS continuously, rather than discovering
    # divergence later when the iOS UI phases start consuming it.
    #
    # Uses the checked-in MudCore-iOS scheme, NOT the package-wide one: SwiftPM
    # cannot exclude a target per-platform, so the default scheme would drag
    # MudUI + MudOutputView_macOS (both AppKit-bound) into the build and fail.
    # See .swiftpm/xcode/xcshareddata/xcschemes/MudCore-iOS.xcscheme.
    name: iOS Tests (simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cache xcodebuild SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-ios-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-ios-spm-

      - name: Pick an iOS simulator
        id: sim
        run: |
          set -euo pipefail
          # Don't pin a device name — runner images change them. Take the first
          # available iPhone and fail loudly if the image has none, rather than
          # letting xcodebuild emit a confusing destination error.
          NAME=$(xcrun simctl list devices available \
            | grep -oE '^ +iPhone [^(]+' | head -1 | sed 's/ *$//;s/^ *//')
          if [ -z "$NAME" ]; then
            echo "No available iPhone simulator on this runner image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      - name: Test MudCore on the iOS simulator
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme MudCore-iOS \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath "$RUNNER_TEMP/ios-dd"

  lint:
    name: Lint & Format
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install pinned linters
        env:
          SWIFTLINT_VERSION: "0.63.3"
          SWIFTFORMAT_VERSION: "0.61.1"
        run: |
          set -euo pipefail
          # Pin to the versions developers run locally, so lint/format rules
          # don't drift when Homebrew ships a new release — that drift is pure CI
          # noise (a new rule firing with no code change). Prebuilt release
          # binaries, so no source compile. The Swift/Xcode toolchain is
          # deliberately NOT pinned (see "Select Xcode") — toolchain drift is real
          # signal we want CI to flag early, unlike linter drift.
          mkdir -p "$RUNNER_TEMP/linters/swiftlint" "$RUNNER_TEMP/linters/swiftformat"
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/linters/swiftlint"
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/linters/swiftformat"
          chmod +x "$RUNNER_TEMP/linters/swiftlint/swiftlint" "$RUNNER_TEMP/linters/swiftformat/swiftformat"
          # Prepend to PATH for the following steps (GITHUB_PATH takes precedence).
          echo "$RUNNER_TEMP/linters/swiftlint" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/linters/swiftformat" >> "$GITHUB_PATH"

      - name: Linter versions
        run: |
          swiftlint --version
          swiftformat --version

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      - name: SwiftLint (strict)
        run: swiftlint --strict --quiet

  vendor-check:
    # The dinv/leveldb plugins the app SHIPS live under
    # Sources/MudCore/Resources/, vendored from the plugins/ submodules. This
    # job fails if those shipped copies drift from the pinned submodules + the
    # local-edit patches (GitHub #67). Pure bash/git/diff — no macOS toolchain
    # needed, and it only fetches the two small plugin submodules (not the large
    # reference clients).
    name: Vendored plugins in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the vendored plugin submodules
        run: git submodule update --init plugins/dinv plugins/leveldb

      - name: Verify shipped copies match submodules + patches
        run: scripts/vendor-plugins.sh --check
